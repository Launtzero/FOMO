# Relève les statistiques GoatCounter toutes les heures et les range dans la branche « stats »
# (fichier stats.json, lu par la page admin). Ne touche pas à la branche main.
name: Statistiques GoatCounter
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: stats
jobs:
  releve:
    runs-on: ubuntu-latest
    steps:
      - name: Relever les chiffres
        env:
          GC_KEY: ${{ secrets.GOATCOUNTER_KEY }}
          GC_CODE: launtzero
        run: |
          if [ -z "$GC_KEY" ]; then echo "Secret GOATCOUNTER_KEY absent"; exit 1; fi
          mkdir out && cd out
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, datetime as dt
          base = "https://%s.goatcounter.com/api/v0" % os.environ["GC_CODE"]
          key = os.environ["GC_KEY"]
          fmt = [lambda d: d.strftime("%Y-%m-%dT%H:00:00Z"), lambda d: d.strftime("%Y-%m-%d")]
          fi = [0]
          def get(path, start, end, **extra):
              while True:
                  q = {"start": fmt[fi[0]](start), "end": fmt[fi[0]](end)}
                  q.update({k: str(v) for k, v in extra.items()})
                  url = base + path + "?" + urllib.parse.urlencode(q)
                  req = urllib.request.Request(url, headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"})
                  try:
                      time.sleep(0.35)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")[:300]
                      if e.code == 400 and fi[0] == 0:
                          fi[0] = 1
                          continue
                      if e.code == 429:
                          time.sleep(2)
                          continue
                      raise SystemExit("GoatCounter %s %s : %s" % (e.code, path, body))
          import urllib.parse
          now = dt.datetime.now(dt.timezone.utc)
          end = now.replace(minute=0, second=0, microsecond=0) + dt.timedelta(hours=1)
          out = {"maj": now.strftime("%Y-%m-%dT%H:%M:%SZ")}
          for days in (7, 30, 90):
              start = (now - dt.timedelta(days=days - 1)).replace(hour=0, minute=0, second=0, microsecond=0) - dt.timedelta(hours=1)
              tot = get("/stats/total", start, end)
              hits = get("/stats/hits", start, end, limit=100)
              refs = get("/stats/toprefs", start, end, limit=8)
              sizes = get("/stats/sizes", start, end)
              locs = get("/stats/locations", start, end, limit=6)
              out["p%d" % days] = {
                  "total": tot.get("total", 0), "total_events": tot.get("total_events", 0),
                  "jours": [{"day": s.get("day"), "daily": s.get("daily", 0)} for s in tot.get("stats") or []],
                  "hits": [{"path": h.get("path"), "title": h.get("title"), "event": bool(h.get("event")), "count": h.get("count", 0)} for h in hits.get("hits") or []],
                  "refs": [{"name": s.get("name"), "count": s.get("count", 0)} for s in refs.get("stats") or []],
                  "sizes": [{"id": s.get("id"), "count": s.get("count", 0)} for s in sizes.get("stats") or []],
                  "locs": [{"id": s.get("id"), "name": s.get("name"), "count": s.get("count", 0)} for s in locs.get("stats") or []],
              }
          json.dump(out, open("stats.json", "w"), ensure_ascii=False, indent=1)
          print("ok", out["p7"]["total"], "visiteurs sur 7 jours")
          PY
      - name: Ranger dans la branche stats
        run: |
          cd out
          git init -q -b stats
          git config user.name "Statistiques FOMO"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json
          git commit -q -m "Statistiques du $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" stats
