<style>
/* Layout: date du jour et mini-calendrier en tête, étiquettes de catégories, puis liste texte par jour. */
:root{
  --bg:#ffffff; --surface:#f7f7f2; --fg:#111110; --muted:#66665d; --line:#e3e3db;
  --accent:#fff53d; --accent-ink:#111110; --hl:#fff53d; --hl-ink:#111110; --warn:#c2410c; --soft:#efefe6; color-scheme:light;
  --f-display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:var(--f-body);
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1a1a19; --fg:#f1f1e8; --muted:#a5a59a; --line:#474741;
  --accent:#fff53d; --accent-ink:#161615; --hl:#fff53d; --hl-ink:#161615; --warn:#ff7a4d; --soft:#33332f; color-scheme:dark;
}

/* Journée : fond blanc, logo noir, date surlignée en jaune. Nuit : fond noir, jaune partout. */
:root:not([data-theme="dark"]) .big small{background:var(--hl);color:var(--hl-ink);padding:0 .25em;margin-left:-.25em}
/* Journée : le jaune du logo sert de surface et de trait ; les textes restent noirs pour rester lisibles sur blanc. */

:root:not([data-theme="dark"]) .det a,:root:not([data-theme="dark"]) footer a,:root:not([data-theme="dark"]) .cal-f button{color:var(--fg);text-decoration-color:var(--accent);text-decoration-thickness:3px}
:root:not([data-theme="dark"]) .more{color:var(--fg);background:var(--accent)}
:root:not([data-theme="dark"]) .tag.g{color:var(--fg);background:var(--accent)}
body{transition:background-color .4s,color .4s}
body,.time,.tag,.dow,.day{font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:64px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:62rem;margin:0 auto;display:flex;flex-direction:column;gap:28px}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:24px 40px;align-items:flex-start;justify-content:flex-start}
.top .cal{order:-1;flex:none}
.top .rub{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:12px}
@media (min-width:561px) and (max-width:860px){.top .rub{border-top:.5px solid var(--fg);padding-top:24px}.top .today{border-left:.5px solid var(--fg);padding-left:40px}}
@media (min-width:861px){.top{flex-wrap:nowrap;align-items:stretch}.top .today{border-left:.5px solid var(--fg);padding-left:40px;flex:none}.top .rub{flex:1 1 0;border-left:.5px solid var(--fg);padding-left:40px;align-content:flex-start}}
.today{min-width:0}
#list{margin-top:40px}
.logo{display:block;width:clamp(210px,48vw,340px);height:auto;color:var(--hl);margin:0 0 14px -4px}
.kicker{font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(3.4rem,11vw,6.5rem);line-height:.95;letter-spacing:-.03em;margin:6px 0 4px;text-wrap:balance}
.big small{display:block;width:fit-content;font-size:clamp(1.3rem,4vw,2rem);font-weight:600;letter-spacing:-.01em;color:var(--accent);margin-top:6px}
.sub{color:var(--muted);max-width:30rem}

.cal{width:17.5rem;max-width:100%}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-family:var(--f-display);font-weight:600;font-size:1rem;text-transform:capitalize}
.cal-h button{background:none;border:0;color:var(--hl);width:40px;height:40px;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.cal-h button:hover{background:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dow{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:2px 0}
.day{position:relative;font-family:var(--f-mono);font-size:12.5px;height:32px;width:32px;justify-self:center;border:0;background:none;color:var(--fg);border-radius:999px;cursor:pointer}
.day:hover{background:var(--soft)}
.day.off{color:var(--muted);opacity:.5}
.day.has::after{display:none;content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
/* date du jour : pas de gras, rond au fond de la page et fin contour (inversé la nuit) */
.day.tod{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 .5px var(--fg)}
.day.now{background:var(--hl);color:var(--hl-ink)}
.day.now::after{background:var(--hl-ink)}

.day.sel{background:var(--hl);color:var(--hl-ink)}
.day.sel::after{background:var(--hl-ink)}
.cal-f:empty{display:none}
.cal-f{margin-top:8px;font-size:12.5px;color:var(--muted)}
.cal-f button{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-decoration:underline}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip i{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.chip[aria-pressed="true"] i{color:inherit;opacity:.8}
.chip.zero{opacity:.55}
.chip[aria-pressed="true"],.chip[aria-pressed="true"]:hover{border-color:var(--hl)}
.chip:focus,.chip:focus-visible,.day:focus,.day:focus-visible{outline:none}
.chip.mute{opacity:.4;cursor:default;border-style:dashed}
.chip.mute:hover{border-color:var(--line)}

.sec{display:flex;flex-direction:column;gap:2px}
.sec h2{font-family:var(--f-display);font-size:1.15rem;font-weight:900;margin:14px 0 6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;text-wrap:balance}
.sec h2 span{font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--muted)}
.row{display:grid;grid-template-columns:4.6rem minmax(0,1fr) auto;gap:4px 14px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.time{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ttl{font-weight:700;min-width:0;overflow-wrap:anywhere}
.ttl a{text-decoration:none}

.meta{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.tag{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;color:var(--fg);white-space:nowrap}
.tag.st{border-color:var(--warn);color:var(--warn)}
.evt{font:inherit;font-weight:700;background:none;border:0;color:inherit;padding:0;text-align:left;cursor:pointer;overflow-wrap:anywhere}
/* pastille ronde « + » entre l'heure et le titre ; le lieu reste aligné sous le titre */
.evt{position:relative;display:block;padding-left:28px}
.evt::before{content:"";position:absolute;left:0;top:calc(.75em - 10px);width:20px;height:20px;border-radius:50%;background:linear-gradient(var(--hl-ink),var(--hl-ink)) center/10px 1.2px no-repeat,linear-gradient(var(--hl-ink),var(--hl-ink)) center/1.2px 10px no-repeat,var(--hl);transition:transform .25s}
.evt[aria-expanded="true"]::before{transform:rotate(45deg)}
.ttl .meta,.ttl .det{padding-left:28px}
.evt:hover,.ttl a:hover{text-decoration:none}
.det{margin-top:6px;padding:8px 12px;border-left:2px solid var(--accent);background:var(--surface);font-weight:400;font-size:14px;display:flex;flex-direction:column;gap:6px;max-width:44rem}
.det p{margin:0}
.det a{color:var(--accent);font-size:13px}
.det{padding:0;border-left:0;background:none;margin-top:8px}
.det a,:root:not([data-theme="dark"]) .det a{align-self:flex-start;font-size:12px;color:var(--fg);text-decoration:none;background:color-mix(in srgb,var(--line) 55%,var(--bg));border-radius:999px;padding:3px 10px}
.det a:hover{background:var(--line)}
.full{color:var(--warn);font-weight:600}
.tag.g{border-color:var(--accent);color:var(--accent)}
.chip{font-size:12.5px;padding:4px 11px;border-color:transparent;background:var(--soft)}
.chip:hover{border-color:transparent;background:var(--line)}
.chip[aria-pressed="true"],.chip[aria-pressed="true"]:hover{background:var(--hl);border-color:transparent}
.chip.mute{border-style:solid}
.tag{font-size:12px;padding:3px 10px;border-color:transparent;background:var(--soft)}
.tag.g,.tag.st{border-color:transparent}
.tag.price{background:color-mix(in srgb,var(--line) 55%,var(--bg));color:var(--fg)}
.tag.price.full{color:var(--warn);font-weight:600}
.tag.new{background:#000;color:#fff;font-weight:700;box-shadow:0 0 0 1px #5a5a52}
.row.gone .ttl a{text-decoration:line-through;color:var(--muted)}
.empty{padding:18px 0;color:var(--muted);border-top:1px solid var(--line)}
.more{align-self:flex-start;margin-top:12px;font:inherit;border:1px solid var(--accent);background:none;color:var(--accent);padding:8px 16px;border-radius:4px;cursor:pointer}
.more:hover{background:var(--accent);color:var(--accent-ink)}

footer{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:8px}
footer ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 16px}
footer a{color:var(--accent)}

@media (max-width:560px){
  .row{grid-template-columns:3.9rem minmax(0,1fr)}
  .tags{grid-column:2;justify-content:flex-start}
  .cal{width:100%}
  .top .today{flex:1 1 100%;width:100%;order:-2}
  body{padding-top:calc((100vw - 28px) * .0475)}
  .logo{width:calc(100% + 4px);max-width:none}
}
:root.vert,:root.vert[data-theme="dark"]{--hl:#7ef95e;--accent:#7ef95e}
:root.vert:not([data-theme="dark"]){--hl:#7ef95e;--accent:#7ef95e}
:root.bleu,:root.bleu[data-theme="dark"]{--hl:#92a9fc;--accent:#92a9fc}
:root.bleu:not([data-theme="dark"]){--hl:#92a9fc;--accent:#92a9fc}
:root.ciel,:root.ciel[data-theme="dark"]{--hl:#92d6fc;--accent:#92d6fc}
:root.ciel:not([data-theme="dark"]){--hl:#92d6fc;--accent:#92d6fc}

/* Carte : colonne à droite sur grand écran, sous la liste sur mobile. */
.body{display:flex;flex-direction:column;gap:32px;margin-top:40px}
#list{margin-top:0}
.map{position:relative;min-width:0}
.map h2{font-family:var(--f-display);font-size:1.15rem;font-weight:900;margin:14px 0 10px}
.map svg{margin-top:14px;display:block;width:100%;height:auto;border-radius:14px;background:var(--soft)}
.map .land{fill:var(--bg)}
.map .sea{fill:var(--soft);stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.map .isl{fill:var(--bg)}
.map .road{fill:none;stroke:var(--line);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.map .lbl{font-family:var(--f-body);fill:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.map .pt{fill:var(--hl);stroke:none;cursor:pointer;transition:r .15s}
.map .pt.on{fill:var(--fg)}
.map .tip{position:absolute;transform:translate(-50%,calc(-100% - 10px));background:var(--fg);color:var(--bg);font-size:12px;line-height:1.3;padding:4px 10px;border-radius:999px;white-space:nowrap;pointer-events:none}
.map .tip[hidden]{display:none}
.map .out-h{margin-top:10px;font-size:12.5px;color:var(--muted)}
.map .out{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;position:relative}
.map .loc{font:inherit;font-family:var(--f-body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;padding:0;cursor:pointer}
.map .loc.on{color:var(--fg)}
.map .tip.below{transform:translate(0,8px);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.row.hit{background:color-mix(in srgb,var(--hl) 22%,transparent)}
@media (min-width:861px){
  .body{display:grid;grid-template-columns:var(--listw,minmax(0,1fr)) var(--mapw,19rem);gap:40px;column-gap:var(--mgap,50px);align-items:start}
  .map{position:sticky;top:20px}
}
/* Essai : pas de filets entre calendrier, logo et rubriques (espacements conservés). */
.top .today,.top .rub{border:0!important}
@media (min-width:861px){.top .today{padding-left:0}.top .rub{padding-left:15px}.wrap{max-width:68rem}}
/* Calendrier un peu plus étroit : le logo ne bouge pas, 10px d'air en plus entre les deux. */
@media (min-width:561px){.top .cal{width:calc(17.5rem - 10px);margin-right:10px}}

/* Recherche : pastille de la taille des rubriques, fond invisible, contour très fin, juste une loupe. */
.srch{position:relative;display:flex;align-items:center;align-self:flex-start;width:4.2rem;max-width:100%;height:27px;border-radius:999px;background:transparent;border:.5px solid var(--muted);cursor:text;transition:width .2s ease,border-color .15s}
.srch:hover{border-color:var(--fg)}
.srch:focus-within,.srch.on{width:17rem;border-color:var(--fg)}
.srch svg{position:absolute;left:11px;width:13px;height:13px;color:var(--fg);pointer-events:none}
.srch input{flex:1;min-width:0;width:100%;height:100%;border:0;background:none;color:var(--fg);font:inherit;font-size:12.5px;padding:0 28px 0 31px;outline:none;-webkit-appearance:none;appearance:none;border-radius:999px;cursor:text}
.srch input::-webkit-search-cancel-button{display:none}
@media (pointer:coarse){.srch input{font-size:16px}}
.srch .x{position:absolute;right:4px;width:19px;height:19px;border:0;border-radius:999px;background:var(--soft);color:var(--fg);font:inherit;font-size:13px;line-height:1;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.srch .x:hover{background:var(--line)}
.chips.dim .chip{opacity:.45}
.sec h3{font-family:var(--f-display);font-size:.95rem;font-weight:700;margin:18px 0 4px;text-transform:capitalize}
mark{background:color-mix(in srgb,var(--hl) 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.det-l{display:flex;align-items:center;gap:6px}
.det .pin{flex:none;width:23px;height:23px;border:0;border-radius:999px;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--line) 55%,var(--bg));color:var(--fg)}
.det .pin svg{width:10px;height:12.5px}
.det .pin:hover{background:var(--line)}
.det .pin[aria-expanded="true"]{background:var(--hl);color:var(--hl-ink)}
.det .adr p{margin:0;font-size:13px;line-height:1.4}
.det .adr-l{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
/* liens de cartes : bouton fond de page, fin contour (blanc/noir le jour, inversé la nuit) */
.det .adr-l a,:root:not([data-theme="dark"]) .det .adr-l a{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 .5px var(--fg)}
.det .adr-l a:hover{background:var(--soft)}
@media (max-width:560px){.body{margin-top:13px}}
/* carte zoomable */
.map svg{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.map.zoomed svg{touch-action:none}
.map.grab svg{cursor:grabbing}
.map .city{fill:var(--fg);font-weight:600}
.map .twn{fill:var(--fg)}
.map .zm{position:absolute;top:22px;right:8px;display:flex;flex-direction:column;gap:6px}
.map .zm button,.map .edge{font:inherit;background:var(--bg);color:var(--fg);border:0;box-shadow:inset 0 0 0 .5px var(--fg);border-radius:999px;cursor:pointer}
.map .zm button{width:28px;height:28px;font-size:17px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.map .zm button:hover,.map .edge:hover{background:var(--soft)}
.map .zm button svg{margin:0!important;width:12px!important;height:12px!important;background:none!important;border-radius:0!important;flex:none}
.map .edges{position:absolute;inset:0;pointer-events:none}
.map .edge{position:absolute;pointer-events:auto;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* FINALISATION */
/* « Proposer un événement » : onglet blanc à fin contour gris foncé, comme la barre de recherche (inversé la nuit) */
footer a.propose,:root:not([data-theme="dark"]) footer a.propose{display:inline-flex;align-items:center;height:27px;padding:0 14px;border-radius:999px;border:.5px solid var(--muted);background:var(--bg);color:var(--fg);font-size:12.5px;text-decoration:none;transition:border-color .15s}
footer a.propose:hover{border-color:var(--fg)}


/* Logo FOMO : centré entre le calendrier et les rubriques, de la hauteur du calendrier ; plus de date dedans */
.logo{margin:0;width:auto;height:auto}
@media (min-width:561px){
  .top .today{flex:1 1 auto;display:flex;justify-content:center;align-items:flex-start}
  .top .today .logo{width:auto;height:268px;max-width:100%;margin-top:-4px}
}
@media (min-width:861px){.top .today{padding:0}.top .rub{flex:0 0 auto;width:min(23rem,34%)}}

/* liste remontée de 30 px */
@media (min-width:561px){.body{margin-top:10px}}

/* calendrier un peu plus resserré sur ordinateur : moins de blanc entre colonnes et lignes */
@media (min-width:861px){
  .top .cal{width:calc(16rem - 10px)}
  .cal .grid{row-gap:0;column-gap:0}

}
/* pastille « + » : à droite, devant le prix et le style ; noire à plus blanc (inversée la nuit) ; devient « − » une fois ouverte */
.evt::before{display:none}
.evt,.ttl .meta,.ttl .det{padding-left:0}
.tags{align-items:center}
.plus{flex:none;width:22px;height:22px;border:0;border-radius:50%;padding:0;margin-right:2px;cursor:pointer;color:var(--bg);background:
  linear-gradient(currentColor,currentColor) center/10px 2px no-repeat,
  linear-gradient(currentColor,currentColor) center/2px 10px no-repeat,
  var(--fg);transition:transform .18s ease,background-size .18s,box-shadow .18s}
@media (hover:hover){
  .plus:hover,.row:has(.evt:hover) .plus{transform:scale(1.12);box-shadow:0 2px 6px color-mix(in srgb,var(--fg) 30%,transparent)}
  .evt:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
}
.plus:active{transform:scale(.9)}
.row:has(.evt[aria-expanded="true"]) .plus{background-size:10px 2px,2px 0,auto}
/* à l'arrivée sur la page, la première pastille fait trois petites ondes pour montrer qu'on peut cliquer */

@keyframes evhint{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--fg) 45%,transparent)}100%{box-shadow:0 0 0 10px color-mix(in srgb,var(--fg) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){:root.hint .sec .row:first-of-type .plus{animation:none}}
/* carte : un seul style d'écriture pour toutes les localités (quartiers, villes, bords, bulle) */
.map .lbl,.map .lbl.city,.map .lbl.twn{font-family:var(--f-body);font-weight:500;fill:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.map .edge,.map .tip{font-family:var(--f-body);font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;line-height:1.3}
.map .edge{padding:3px 9px;color:var(--muted)}
.map .tip{padding:4px 10px}

/* le O s'arrondit jusqu'au cercle parfait puis revient, douze fois par minute, comme une respiration (animation dans le logo) */

/* LUEUR : jaune = lueur orangée du logo ; autres couleurs = même teinte, plus foncée (comme en produit). Pastilles : lueur plus douce que le logo. */
/* logo jaune (concerts) : lueur recalée sur le fichier d'origine ; pastilles inchangées */
:root{--glow:#ff7d14;--glow-o:.13;--glow-l:.16}
.logo .lueur-c{flood-color:var(--glow);flood-opacity:var(--glow-l,var(--glow-o))}
.chip[aria-pressed="true"],.day.now,.day.sel,.det .pin[aria-expanded="true"],:root:not([data-theme="dark"]) .tag.g,:root:not([data-theme="dark"]) .more,:root:not([data-theme="dark"]) .big small{box-shadow:inset 0 0 7px color-mix(in srgb,var(--glow) calc(var(--glow-o) * 45%),transparent)}

.logo .accroche{color:var(--fg)}
.logo .accroche-sur{fill:var(--fg)}
/* téléphone : le milieu des O aligné sur le J (jeudi) du calendrier */
@media (max-width:560px){.top .today .logo{width:min(60vw,246px);margin-left:calc(50vw - 16px - .7753 * min(60vw,246px));margin-bottom:22px}
  /* plus d'air entre calendrier et barre de recherche */
  .top .rub{margin-top:16px}}
/* ordinateur : logo réduit deux fois à 95 % pour laisser respirer */
/* nuit : accroche en gris clair */
:root[data-theme="dark"] .logo .accroche{color:#8e8e88}
@media (min-width:561px){.top .today .logo{height:230px;margin-top:-1px}}
/* l'accroche passe en texte grisé dans la barre de recherche, qui reste ouverte */
.srch{width:15.5rem}

.srch:focus-within input::placeholder{opacity:0;color:transparent}

<script>

function START(DB){
var DESC={},OCC=[];

    var o={t:ev.titre,v:ev.lieu,c:cc,s:ev.source||"",u:ev.lien||"",x:ev.statut||"",n:ev.note||"",g:ev.genre||"",p:ev.prix||"",i:ri,d:"",h:"",e:""};

    else{var q=sp.split(" ");o.d=q[0];o.h=q[1]||"";}

  });
});
OCC.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.h<b.h?-1:a.h>b.h?1:0)});

function pad(n){return (n<10?"0":"")+n}
function ymd(dt){return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate())}
function dt(s){return new Date(s+"T12:00:00")}
var T=ymd(new Date());
var MUTE={jam:1,standup:1,humour:1,cinema:1,festival:1};
var state={sel:null,cats:{concert:true},y:+T.slice(0,4),m:+T.slice(5,7)-1,more:1,run:false};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmtLong(s){return dt(s).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
function fmtShort(s){return dt(s).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}

function alive(o){return (o.e||o.d)>=T}

/* Date dans le logo : chaque ligne prend la largeur du T par sa taille de police, sans déformer les lettres. */
function fitDate(){
  /* logo resserré : colonne de gauche (B, G) +2, colonne de droite (U, date) −2 */
  var X=363.24,W=20.69,TOP=556.15,BOT=579.9,CAP=.714;
  var ids=["lg-w","lg-d","lg-m"],els=ids.map(function(i){return document.getElementById(i)});
  if(!els[0]||!els[0].getComputedTextLength)return;
  var fs=els.map(function(el){el.style.fontSize="10px";var w=el.getComputedTextLength()||1;return 10*W/w});
  var f=Math.min(fs[0],fs[2]),GAP=1.2;
  var big=Math.min(fs[1],(BOT-TOP-2*GAP-2*f*CAP)/CAP);
  fs=[f,big,f];var caps=fs.map(function(f){return f*CAP}),gap=(BOT-TOP-caps[0]-caps[1]-caps[2])/2;
  var y=TOP;
  els.forEach(function(el,i){el.style.fontSize=fs[i].toFixed(2)+"px";y+=caps[i];el.setAttribute("x",X);el.setAttribute("y",y.toFixed(2));y+=gap});
  var wm=els[2].getComputedTextLength()||W;els[0].setAttribute("text-anchor","middle");els[0].setAttribute("x",(X+wm/2).toFixed(2));els[1].style.fontVariantNumeric="proportional-nums";var C=X+wm/2,cx=(fitDate.cv||(fitDate.cv=document.createElement("canvas"))).getContext("2d"),cs=getComputedStyle(els[1]);cx.font="900 "+parseFloat(cs.fontSize)*10+"px "+cs.fontFamily;var mt=cx.measureText(els[1].textContent),ink=(mt.actualBoundingBoxRight-mt.actualBoundingBoxLeft)/20;els[1].setAttribute("text-anchor","start");els[1].setAttribute("x",(C-ink).toFixed(2));
}

/* calendrier */
function cal(){
  var y=state.y,m=state.m;
  var first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  var title=first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});

  }
  h+='</div>';
  document.getElementById("cal").innerHTML=h;
}

/* étiquettes */
function chips(){
  var cnt={},D=state.sel||T;OCC.forEach(function(o){if(cover(o,D))o.c.forEach(function(c){cnt[c]=(cnt[c]||0)+1})});
