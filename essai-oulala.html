/* pastille « + » : à droite, devant le prix et le style ; noire à plus blanc (inversée la nuit) ; devient « − » une fois ouverte */
.evt::before{display:none}
.evt,.ttl .meta,.ttl .det{padding-left:0}
.tags{align-items:center}
.plus{flex:none;width:22px;height:22px;border:0;border-radius:50%;padding:0;margin-right:2px;cursor:pointer;color:var(--bg);background:
  linear-gradient(currentColor,currentColor) center/10px 2px no-repeat,
  linear-gradient(currentColor,currentColor) center/2px 10px no-repeat,
  var(--fg);transition:transform .18s ease,background-size .18s,box-shadow .18s}
@media (hover:hover){

}
.plus:active{transform:scale(.9)}
.row:has(.evt[aria-expanded="true"]) .plus{background-size:10px 2px,2px 0,auto}
/* à l'arrivée sur la page, la première pastille fait trois petites ondes pour montrer qu'on peut cliquer */
:root.hint .sec .row:first-of-type .plus{animation:evhint 1.5s ease-out .8s 3}
@keyframes evhint{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--fg) 45%,transparent)}100%{box-shadow:0 0 0 10px color-mix(in srgb,var(--fg) 0%,transparent)}}

.map .edge{padding:3px 9px;color:var(--muted)}
.map .tip{padding:4px 10px}

/* le O s'arrondit jusqu'au cercle parfait puis revient, douze fois par minute, comme une respiration (animation dans le logo) */

/* LUEUR : jaune = lueur orangée du logo ; autres couleurs = même teinte, plus foncée (comme en produit). Pastilles : lueur plus douce que le logo. */
